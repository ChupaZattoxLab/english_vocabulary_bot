services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-english_vocabulary_oald}
      POSTGRES_USER: ${POSTGRES_USER:-vocab_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocab_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vocabulary_postgres_data:/var/lib/postgresql/data
      - ./database/init/10-restore-oald-seed.sh:/docker-entrypoint-initdb.d/10-restore-oald-seed.sh:ro
      - ./data/backups/english_vocabulary_oald_seed_2026-08-01.dump.parts:/database-seed:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  vocabulary_postgres_data:
