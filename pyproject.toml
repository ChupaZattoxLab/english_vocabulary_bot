[project]
name = "english-vocabulary-bot"
version = "0.1.0"
description = "Telegram bot that sends OALD-backed vocabulary cards from PostgreSQL"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram>=3.20,<4",
    "imageio-ffmpeg>=0.6,<1",
    "psycopg[binary,pool]>=3,<4",
    "alembic>=1.19.0,<2",
    "sqlalchemy>=2.0.51,<3",
    "psutil>=7.2.2,<8",
]

[project.scripts]
start = "vocabulary_bot.commands:start"
stop = "vocabulary_bot.commands:stop"
migrate = "vocabulary_bot.commands:migrate"
check = "vocabulary_bot.commands:check"
test = "vocabulary_bot.commands:test"
format = "vocabulary_bot.commands:format_code"
lint = "vocabulary_bot.commands:lint"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vocabulary_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/build_database", "."]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
