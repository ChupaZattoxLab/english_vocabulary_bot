name: test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_OALD_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      OALD_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Pyright
        run: uv run typecheck

      - name: Pytest
        run: uv run pytest -q
