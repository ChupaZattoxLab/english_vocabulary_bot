name: test-and-publish

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to test, build, and deploy (usually main)
        required: true
        default: main

permissions:
  contents: read
  packages: write
  checks: read
  actions: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    uses: ./.github/workflows/publish-image.yml
    with:
      git_ref: ${{ inputs.git_ref }}
      require_green_test: false
    secrets: inherit
